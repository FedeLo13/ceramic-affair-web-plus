spring.application.name=ceramic_affair_web_plus

# Configuración de la conexión a la base de datos
spring.datasource.url=${SPRING_DATASOURCE_URL_PLUS:jdbc:mysql://localhost:3306/ceramic_affair_db_plus}
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA (Java Persistence API)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Activa la generación automática de las tablas
spring.jpa.generate-ddl=true

# Ruta de la carpeta de almacenamiento de imágenes
ceramic.affair.images.path=uploads

# Configuración del tamaño máximo de archivos de imagen
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Configuración de Spring Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=fedevlopez17@gmail.com
spring.mail.password=${MAIL_PASSWORD}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
mail.to=fedevlopez17@gmail.com

# Configuración de reCAPTCHA
recaptcha.site-key=${RECAPTCHA_SITE_KEY}
recaptcha.secret-key=${RECAPTCHA_SECRET_KEY}

# Configuración de logging
logging.level.root=INFO
logging.level.es.uca.ceramic_affair_web=DEBUG
logging.file.name=logs/ceramic_affair_web.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=5